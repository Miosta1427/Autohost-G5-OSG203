# ==============================================================================
# File cấu hình dùng chung cho hệ thống AutoHost
# Đường dẫn khi cài đặt: /opt/autohost/conf/autohost.conf
# ==============================================================================

# Thư mục cài đặt gốc của chương trình AutoHost
BASE_DIR="/opt/autohost"

# Thư mục gốc chứa toàn bộ dữ liệu web của các khách hàng (/var/www/<user>/public_html)
WEB_ROOT="/var/www"

# File cơ sở dữ liệu dạng bảng CSV lưu danh sách các website đang hoạt động
SITES_DB="/etc/autohost/sites.csv"

# File nhật ký (log) ghi lại mọi hoạt động và lỗi của hệ thống
LOG_FILE="/var/log/autohost.log"

# Thư mục lưu trữ các bản sao lưu (backup) hằng ngày
BACKUP_DIR="/backup"

# Thư mục chứa chứng chỉ bảo mật SSL của các tên miền
SSL_DIR="/etc/ssl/autohost"

# Thư mục chứa cấu hình các trang web của Apache
APACHE_SITES_AVAIL="/etc/apache2/sites-available"

# Thư mục chứa nhật ký truy cập riêng của từng trang web
APACHE_LOG_DIR="/var/log/apache2"

# Tên nhóm phụ dành riêng cho khách hàng sử dụng SFTP bị giới hạn thư mục (chroot)
SFTP_GROUP="sftpusers"

# Tài khoản mặc định chạy dịch vụ máy chủ web Apache trên Ubuntu
APACHE_USER="www-data"

# Số ngày lưu giữ bản sao lưu trước khi tự động xóa bản cũ
BACKUP_RETENTION_DAYS="7"
